apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linguawalk
  namespace: linguawalk
  labels:
    app.kubernetes.io/name: linguawalk
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: linguawalk-linguawalk-rate-limit@kubernetescrd,linguawalk-linguawalk-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: linguawalk.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linguawalk
                port:
                  number: 8000
