---
# =============================================================================
# Playbook: configure-unattended-upgrades.yaml
# Purpose:  Install and configure automatic security-only patching on all
#           homelab nodes (Proxmox PVE 9.x hosts + K3s VMs on Debian 13).
#
# Behaviour:
#   - Applies Debian 13 security updates automatically every night
#   - Does NOT auto-reboot (reboots are managed via patch-cluster.yaml)
#   - Blacklists PVE core packages on Proxmox hosts to prevent uncontrolled
#     hypervisor upgrades
#   - Logs to /var/log/unattended-upgrades/
#
# Usage:
#   ansible-playbook playbooks/configure-unattended-upgrades.yaml
#   ansible-playbook playbooks/configure-unattended-upgrades.yaml --check
# =============================================================================

- name: "Configure unattended-upgrades on K3s nodes"
  hosts: k3s_cluster
  become: true

  tasks:
    - name: "Install unattended-upgrades"
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: yes

    - name: "Configure allowed security origins for Debian 13"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          // Unattended-Upgrades configuration for Debian 13 (Trixie) K3s nodes
          // Only applies security updates — full upgrades are handled via patch-cluster.yaml

          Unattended-Upgrade::Allowed-Origins {
              "origin=Debian,codename=${distro_codename},label=Debian-Security";
              "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          };

          // Never auto-remove packages — prevents accidentally removing k3s deps
          Unattended-Upgrade::Remove-Unused-Dependencies "false";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "false";

          // Do NOT auto-reboot — reboots are controlled via patch-cluster.yaml
          Unattended-Upgrade::Automatic-Reboot "false";

          // Write to syslog so logs are visible in journalctl
          Unattended-Upgrade::SyslogEnable "true";
          Unattended-Upgrade::SyslogFacility "daemon";

          // Verbose logging
          Unattended-Upgrade::Verbose "false";
          Unattended-Upgrade::Debug "false";

    - name: "Enable daily automatic updates (APT periodic config)"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: "Enable and start unattended-upgrades service"
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: yes
        state: started

    - name: "Verify configuration is valid"
      ansible.builtin.command: unattended-upgrade --dry-run --debug
      register: verify_result
      changed_when: false
      failed_when: false

    - name: "Print verification result"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: unattended-upgrades configured ✓"


- name: "Configure unattended-upgrades on Proxmox hosts"
  hosts: proxmox
  become: false   # Proxmox hosts connect as root directly — no sudo needed

  tasks:
    - name: "Install unattended-upgrades"
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: yes

    - name: "Configure allowed security origins for PVE 9 (Debian 13 base)"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          // Unattended-Upgrades configuration for Proxmox VE 9 hosts (Debian 13 Trixie)
          // Only applies Debian security updates.
          // PVE core packages are blacklisted — upgrade those manually via pveupgrade.

          Unattended-Upgrade::Allowed-Origins {
              "origin=Debian,codename=${distro_codename},label=Debian-Security";
              "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          };

          // Blacklist PVE core packages — these must be upgraded manually
          // to avoid breaking the hypervisor or VM migrations mid-upgrade.
          Unattended-Upgrade::Package-Blacklist {
              "proxmox-ve";
              "pve-manager";
              "pve-kernel.*";
              "pve-headers.*";
              "pve-firmware";
              "libpve-.*";
              "pve-qemu-kvm";
              "corosync";
              "qemu-server";
          };

          // Do NOT auto-remove anything on a hypervisor
          Unattended-Upgrade::Remove-Unused-Dependencies "false";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "false";

          // Do NOT auto-reboot — a PVE host reboot requires migrating VMs first
          Unattended-Upgrade::Automatic-Reboot "false";

          Unattended-Upgrade::SyslogEnable "true";
          Unattended-Upgrade::SyslogFacility "daemon";

    - name: "Enable daily automatic updates"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: "Enable and start unattended-upgrades service"
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: yes
        state: started

    - name: "Print confirmation"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: unattended-upgrades configured (PVE packages blacklisted) ✓"
