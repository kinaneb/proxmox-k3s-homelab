apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
images:
  - name: registry.example.invalid/linguawalk
    newName: registry.example.invalid/linguawalk
    newTag: replace-with-image-tag
patches:
  - target:
      kind: Ingress
      name: linguawalk
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: linguawalk.example.invalid
