---
# =============================================================================
# Playbook: patch-cluster.yaml
# Purpose:  Controlled, rolling full upgrade (apt upgrade) of the entire
#           homelab cluster with full K3s lifecycle awareness.
#
# Patch order (safest to most sensitive):
#   Phase 1: K3s Workers  — cordon → drain → upgrade → reboot? → uncordon
#   Phase 2: K3s Masters  — cordon → drain → upgrade → reboot? → uncordon
#   Phase 3: Proxmox hosts — upgrade only, flag reboot (no auto-reboot)
#
# Prerequisites:
#   - kubectl must be configured and working on the Ansible controller
#   - All nodes must be reachable via SSH
#   - Cluster must be healthy (all nodes Ready) before running
#
# Usage:
#   ansible-playbook playbooks/patch-cluster.yaml               # full run
#   ansible-playbook playbooks/patch-cluster.yaml --check       # dry-run
#   ansible-playbook playbooks/patch-cluster.yaml --limit k3s_workers
#   ansible-playbook playbooks/patch-cluster.yaml --limit proxmox
# =============================================================================

# -----------------------------------------------------------------------------
# Phase 1: K3s Worker Nodes (one at a time)
# Workers are patched first — they carry workloads but not etcd state,
# so draining them is lower risk than touching masters.
# -----------------------------------------------------------------------------
- name: "Phase 1 — Patch K3s worker nodes (rolling, one at a time)"
  hosts: k3s_workers
  become: true
  serial: 1          # Critical: patches one worker at a time to preserve capacity

  tasks:
    - name: "Pre-check: verify cluster is healthy before touching this node"
      ansible.builtin.command: kubectl get node {{ inventory_hostname }}
      delegate_to: localhost
      become: false
      changed_when: false
      register: node_status
      failed_when: "'NotReady' in node_status.stdout"

    - name: "Cordon node (stop new pod scheduling)"
      ansible.builtin.command: kubectl cordon {{ inventory_hostname }}
      delegate_to: localhost
      become: false
      changed_when: true

    - name: "Drain node (evict all pods gracefully)"
      ansible.builtin.command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets
        --delete-emptydir-data
        --timeout=180s
        --grace-period=30
      delegate_to: localhost
      become: false
      changed_when: true

    - name: "Update apt package cache"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: "Run full package upgrade"
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: apt_upgrade_result

    - name: "Print packages upgraded"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ apt_upgrade_result.stdout_lines | select('match', '^[0-9]+ upgraded') | list }}"
      when: apt_upgrade_result.stdout_lines is defined

    - name: "Check if reboot is required"
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: "Reboot if kernel or libc was updated"
      ansible.builtin.reboot:
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 20
        msg: "Rebooting {{ inventory_hostname }} for kernel/package update"
      when: reboot_required_file.stat.exists

    - name: "Wait for node to rejoin cluster as Ready"
      ansible.builtin.command: >
        kubectl wait node {{ inventory_hostname }}
        --for=condition=Ready
        --timeout=300s
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "Uncordon node (re-enable pod scheduling)"
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: localhost
      become: false
      changed_when: true

    - name: "Wait 20s for workloads to rebalance before moving to next node"
      ansible.builtin.pause:
        seconds: 20


# -----------------------------------------------------------------------------
# Phase 2: K3s Master Nodes (one at a time)
# Masters run etcd — we patch them last among K3s nodes, one at a time,
# waiting for etcd quorum to stabilize after each restart.
# -----------------------------------------------------------------------------
- name: "Phase 2 — Patch K3s master nodes (rolling, one at a time)"
  hosts: k3s_masters
  become: true
  serial: 1          # Critical: only one etcd member down at a time

  tasks:
    - name: "Pre-check: verify etcd quorum is healthy"
      ansible.builtin.command: kubectl get node {{ inventory_hostname }}
      delegate_to: localhost
      become: false
      changed_when: false
      register: node_status
      failed_when: "'NotReady' in node_status.stdout"

    - name: "Cordon master node"
      ansible.builtin.command: kubectl cordon {{ inventory_hostname }}
      delegate_to: localhost
      become: false
      changed_when: true

    - name: "Drain master node (ignore daemonsets for etcd/flannel)"
      ansible.builtin.command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets
        --delete-emptydir-data
        --timeout=180s
        --grace-period=30
      delegate_to: localhost
      become: false
      changed_when: true

    - name: "Update apt package cache"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: "Run full package upgrade"
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: apt_upgrade_result

    - name: "Print packages upgraded"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ apt_upgrade_result.stdout_lines | select('match', '^[0-9]+ upgraded') | list }}"
      when: apt_upgrade_result.stdout_lines is defined

    - name: "Check if reboot is required"
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: "Reboot if required (k3s/etcd will restart automatically)"
      ansible.builtin.reboot:
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
        msg: "Rebooting {{ inventory_hostname }} for kernel/package update"
      when: reboot_required_file.stat.exists

    - name: "Wait for master to rejoin as Ready"
      ansible.builtin.command: >
        kubectl wait node {{ inventory_hostname }}
        --for=condition=Ready
        --timeout=300s
      delegate_to: localhost
      become: false
      changed_when: false

    - name: "Uncordon master node"
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: localhost
      become: false
      changed_when: true

    - name: "Wait 30s for etcd to stabilize before moving to next master"
      ansible.builtin.pause:
        seconds: 30


# -----------------------------------------------------------------------------
# Phase 3: Proxmox Hypervisor Hosts
# Upgraded independently from K3s. PVE hosts are NOT auto-rebooted — a PVE
# reboot requires a separate maintenance window to migrate/stop VMs first.
# -----------------------------------------------------------------------------
- name: "Phase 3 — Patch Proxmox PVE hosts (no auto-reboot)"
  hosts: proxmox
  become: false   # Proxmox hosts connect as root directly — no sudo needed

  tasks:
    - name: "Update apt package cache"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: "Upgrade all packages (PVE + Debian base)"
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: pve_upgrade_result

    - name: "Print packages upgraded"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ pve_upgrade_result.stdout_lines | select('match', '^[0-9]+ upgraded') | list }}"
      when: pve_upgrade_result.stdout_lines is defined

    - name: "Update PVE appliance template index"
      ansible.builtin.command: pveam update
      changed_when: false
      failed_when: false

    - name: "Check if reboot is required on PVE host"
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: pve_reboot_required

    - name: "⚠️  REBOOT REQUIRED — schedule a maintenance window"
      ansible.builtin.debug:
        msg: >
          ⚠️  {{ inventory_hostname }} requires a reboot (kernel/PVE update installed).
          Schedule a maintenance window: migrate or stop VMs on this host,
          then run: ssh root@{{ ansible_host }} reboot
      when: pve_reboot_required.stat.exists

    - name: "✅  No reboot required"
      ansible.builtin.debug:
        msg: "✅  {{ inventory_hostname }} is fully patched — no reboot needed."
      when: not pve_reboot_required.stat.exists
